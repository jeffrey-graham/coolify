# documentation: https://docker-mailserver.github.io/docker-mailserver/latest/
# slogan: A fullstack but simple mail server (SMTP, IMAP, LDAP, Antispam, Antivirus, etc.) using Docker.
# category: email
# tags: mail, email, smtp, imap, mailserver, postfix, dovecot, dkim, spf, dmarc
# logo: svgs/docker-mailserver.svg
# port: 25

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${SERVICE_FQDN_MAILSERVER}
    env_file: .env
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - mail-data:/var/mail/
      - mail-state:/var/mail-state/
      - mail-logs:/var/log/mail/
      - mail-config:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SERVICE_FQDN_MAILSERVER
      - DMS_VMAIL_UID=${DMS_VMAIL_UID:-5000}
      - DMS_VMAIL_GID=${DMS_VMAIL_GID:-5000}
      - ENABLE_RSPAMD=${ENABLE_RSPAMD:-1}
      - ENABLE_CLAMAV=${ENABLE_CLAMAV:-0}
      - ENABLE_FAIL2BAN=${ENABLE_FAIL2BAN:-1}
      - SSL_TYPE=${SSL_TYPE:-}
      - SPOOF_PROTECTION=${SPOOF_PROTECTION:-1}
    cap_add:
      - NET_ADMIN
    restart: always
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "ss", "--listening", "--tcp", "|", "grep", "-P", "'LISTEN.+:smtp'"]
      timeout: 3s
      retries: 0

volumes:
  mail-data:
  mail-state:
  mail-logs:
  mail-config:
